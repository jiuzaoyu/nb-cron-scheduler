# 字段说明:
#   name:        任务名称，唯一标识
#   cron:        (可选) cron 表达式，定义任务触发时间规则 (秒 分 时 日 月 星期)，不填则仅可手动触发
#   stream:      Redis stream key，消息发布与接收的通道
#   payload:     任务载荷，传递给执行器的业务参数
#   timeout:     任务超时时间，单位秒，超时后任务会被终止
#   max_retries: 最大重试次数，任务失败后的重试上限
jobs:
  - name: 每日净值增量更新
    cron: "0 30 16 * * 1-5"
    stream: "cron:jobs:fund_queue_1"
    payload:
      job_type: "fund_incremental"
    timeout: 600
    max_retries: 3

  - name: 基金列表刷新
    cron: "0 01 6 * * 1"
    stream: "cron:jobs:fund_queue_1"
    payload:
      job_type: "fund_list_refresh"
    timeout: 900
    max_retries: 2

  - name: 每日净值估算
    cron: "0 25 15 * * *"
    stream: "cron:jobs:fund_queue_1"
    payload:
      job_type: "nav_estimation"
    timeout: 300
    max_retries: 2
  
  - name: 基金历史净值采集
    cron: "0 0 0 31 2 *"
    stream: "cron:jobs:fund_queue_1"
    payload:
      job_type: "fund_history_nav_refresh"
    timeout: 300
    max_retries: 2

  - name: 基金经理数据采集【全量】
    cron: "0 0 1 * * 1"
    stream: "cron:jobs:fund_queue_1"
    payload:
      job_type: "fund_manager_refresh"
    timeout: 300
    max_retries: 2

  - name: 基金持仓数据采集【全量】
    cron: "0 0 2 1 * *"
    stream: "cron:jobs:fund_queue_1"
    payload:
      job_type: "fund_holdings_refresh"
    timeout: 300
    max_retries: 2

